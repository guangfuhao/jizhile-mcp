name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIZHILE_CONFIG_FILE: /tmp/jizhile-ci-no-credentials.json
      JIZHILE_ARK_CONFIG_FILE: /tmp/jizhile-ci-no-ark-credentials.json
      JIZHILE_YDDM_CONFIG_FILE: /tmp/jizhile-ci-no-yddm-credentials.json
      JIZHILE_STATE_DIR: /tmp/jizhile-ci-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/mcp_smoke.py
      - name: Verify portable plugin and source match
        run: |
          python scripts/package_plugin.py
          git diff --exit-code -- bundle
      - name: Verify portable plugin starts without credentials
        run: JIZHILE_SMOKE_ROOT="$PWD/bundle" uv run --frozen python scripts/mcp_smoke.py
      - run: uv build
      - run: python scripts/build_release.py
      - run: python scripts/check_secrets.py
